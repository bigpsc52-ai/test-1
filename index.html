<meta charset="UTF-8">
<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>달빛카페 메뉴판</title>
<style>
  body {
    background-color: #fffaf0;
    color: #333333;
    font-family: 'Malgun Gothic', sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    min-height: 100vh;
    box-sizing: border-box;
  }
  .container {
    width: 100%;
    max-width: 480px;
    text-align: center;
  }
  h1 {
    font-size: 38px;
    color: #4a3525;
    margin-bottom: 30px;
    border-bottom: 3px solid #d4a373;
    padding-bottom: 15px;
  }
  .menu-list {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 100%;
  }
  .menu-item {
    background: #ffffff;
    padding: 22px 20px;
    border-radius: 12px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.06);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 24px;
    font-weight: bold;
  }
  .menu-name {
    color: #2c2c2c;
  }
  .menu-price {
    color: #b08968;
  }
  footer {
    font-size: 16px;
    color: #888888;
    margin-top: 30px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>달빛카페</h1>
    <div class="menu-list">
      <div class="menu-item">
        <span class="menu-name">아메리카노</span>
        <span class="menu-price">3,500원</span>
      </div>
      <div class="menu-item">
        <span class="menu-name">카페라떼</span>
        <span class="menu-price">4,000원</span>
      </div>
      <div class="menu-item">
        <span class="menu-name">딸기케이크</span>
        <span class="menu-price">5,500원</span>
      </div>
    </div>
  </div>
  <footer>가상의 가게입니다</footer>
</body>
</html>
